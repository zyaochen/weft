# Desktop packages for the three platforms. Triggered by version tags (and
# by hand). The release lifecycle is draft-first: a draft is created before
# the builds, every platform uploads into it, and a final job publishes it
# only when ALL of them succeeded. Installed apps checking for updates
# during the build window therefore keep seeing the previous complete
# release instead of a half-uploaded new one (the "could not check for
# updates" 404s of the per-job-publish era).
name: desktop
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    permissions:
      contents: write # draft release create / upload / publish
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release view "$TAG" -R "$REPO" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$REPO" --draft --title "$TAG" --notes "Build in progress."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  build:
    permissions:
      contents: write # draft release create / upload / publish
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned: the macos-latest (macos-26) image that rolled out on
          # 2026-09-06 (Darwin 25.6.0) breaks electron-builder 26.15's temporary
          # signing keychain (`security set-key-partition-list` rejects the
          # keychain password). macos-15 is arm64 too and matches our target.
          - os: macos-15
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: desktop
      - name: npm run ${{ matrix.script }}
        working-directory: desktop
        shell: bash
        # Without a certificate the macOS app is ad-hoc signed, not notarized,
        # and built without the hardened runtime: ad-hoc + hardened runtime
        # refuses to load Electron Framework ("different Team IDs"). An empty
        # CSC_LINK must be unset, or electron-builder reads the cwd as the
        # certificate ("desktop not a file").
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -z "$CSC_LINK" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            extra=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.mac.notarize=false)
          fi
          npm run ${{ matrix.script }} -- "${extra[@]}"
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERT_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERT_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # electron-updater needs both halves: the feed on the release (latest*.yml)
      # and the app's own pointer to it (resources/app-update.yml).
      - name: Check the update feed was generated
        working-directory: desktop/out
        shell: bash
        run: |
          shopt -s nullglob
          feeds=(latest*.yml) pointers=(*/Weft.app/Contents/Resources/app-update.yml *-unpacked/resources/app-update.yml)
          echo "feeds: ${feeds[*]}"; echo "pointers: ${pointers[*]}"
          [ ${#feeds[@]} -gt 0 ] && [ ${#pointers[@]} -gt 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/out/*.dmg
            desktop/out/*.zip
            desktop/out/*.exe
            desktop/out/*.AppImage
            desktop/out/latest*.yml
          if-no-files-found: error
      - name: Upload into draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          shopt -s nullglob
          files=(desktop/out/*.dmg desktop/out/*.zip desktop/out/*.exe \
                 desktop/out/*.AppImage desktop/out/latest*.yml desktop/out/*.blockmap)
          gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  # The DeepSeek Harness plugin rides along as dsh-weft-<version>.tgz; `dsh plugin add` takes its URL.
  dsh-plugin:
    permissions:
      contents: write # draft release create / upload / publish
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm pack
        working-directory: dsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-plugin
          path: dsh/dsh-weft-*.tgz
          if-no-files-found: error
      - name: Upload into draft release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release upload "$TAG" dsh/dsh-weft-*.tgz -R "$REPO" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}

  # Same tarball to npm through Trusted Publishing (package dsh-weft → Settings →
  # Trusted Publisher: zyaochen/weft, desktop-build.yml, publish allowed). Not
  # a prerequisite of the release: a failure here leaves the desktop release intact.
  dsh-npm:
    if: startsWith(github.ref, 'refs/tags/')
    needs: dsh-plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install -g npm@11.19.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dsh-plugin
      - name: Publish dsh-weft unless this version is on npm
        run: |
          tgz=$(ls dsh-weft-*.tgz)
          v=${tgz#dsh-weft-}; v=${v%.tgz}
          if npm view "dsh-weft@$v" version >/dev/null 2>&1; then echo "dsh-weft@$v is already on npm"; exit 0; fi
          npm publish "./$tgz" --provenance --access public

  publish:
    permissions:
      contents: write # draft release create / upload / publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, dsh-plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release notes: the CHANGELOG section headed "## [<tag>]", when there is one.
      - name: Release notes from CHANGELOG
        run: |
          awk -v h="## [$TAG]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then gh release edit "$TAG" -R "$REPO" --notes-file notes.md; fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
      - name: Publish release (all platforms complete)
        run: |
          if [[ "$TAG" == *beta* ]]; then
            gh release edit "$TAG" -R "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" -R "$REPO" --draft=false --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
