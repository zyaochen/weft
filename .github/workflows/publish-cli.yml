# Publish the weft-canvas CLI on a `cli-v<version>` tag: npm (Trusted
# Publishing with provenance), the MCP Registry, and a GitHub Release whose
# asset is the exact tarball npm serves.
#
# One-time setup on npmjs.com (package weft-canvas → Settings → Trusted
# Publisher → GitHub Actions): owner zyaochen, repository weft, workflow
# filename publish-cli.yml, environment left empty. No npm token is stored
# anywhere; until that is registered the npm step fails with 404.
#
# Every step skips work that is already done (npm version, Registry entry,
# Release asset), so a rerun finishes whatever failed. Keep cli/package.json,
# cli/server.json and CLI_VERSION in cli/src/lib.ts at the same version.
name: publish cli

on:
  push:
    tags: ['cli-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release
      id-token: write # npm Trusted Publishing and MCP Registry login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No registry-url: a placeholder token in .npmrc would skip the OIDC exchange.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Trusted Publishing needs npm >= 11.5.1; pin the version the lockfile was checked with.
      - run: npm install -g npm@11.19.0 && npm --version

      - run: npm ci

      - name: Check versions agree
        id: meta
        run: |
          version=$(node -p "require('./cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "cli-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match cli/package.json $version" >&2
            exit 1
          fi
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('cli/package.json', 'utf8'));
          const server = JSON.parse(fs.readFileSync('cli/server.json', 'utf8'));
          const lib = fs.readFileSync('cli/src/lib.ts', 'utf8');
          assert.equal(server.name, pkg.mcpName);
          assert.equal(server.version, pkg.version);
          assert.equal(server.packages[0].identifier, pkg.name);
          assert.equal(server.packages[0].version, pkg.version);
          assert.match(lib, new RegExp(`const CLI_VERSION = '${pkg.version.replace(/\./g, '\\.')}'`));
          JS

      - name: Decide whether npm needs this version
        id: npm
        run: |
          if npm view "weft-canvas@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "weft-canvas@${{ steps.meta.outputs.version }} is already on npm"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test the CLI
        if: steps.npm.outputs.publish == 'true'
        run: npm --prefix cli test

      - name: Pack and publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: |
          npm run cli:pack
          # ./ matters: npm reads "cli/x.tgz" as the GitHub repository cli/x.tgz
          npm publish "./cli/weft-canvas-${{ steps.meta.outputs.version }}.tgz" --provenance --access public

      # 0.5.1 took about 4 minutes to become readable after the publish.
      - name: Wait for the npm version to be publicly readable
        run: |
          for attempt in $(seq 1 60); do
            if npm view "weft-canvas@${{ steps.meta.outputs.version }}" version --prefer-online >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          echo 'The npm version is not public yet; rerun after propagation.' >&2
          exit 1

      - name: Check MCP Registry version
        id: registry
        run: |
          url=$(node -p "const s = require('./cli/server.json'); 'https://registry.modelcontextprotocol.io/v0.1/servers/' + encodeURIComponent(s.name) + '/versions/' + encodeURIComponent(s.version)")
          status=$(curl --silent --show-error --retry 3 --max-time 30 --output /dev/null --write-out '%{http_code}' "$url")
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "MCP Registry lookup failed: HTTP $status" >&2; exit 1 ;;
          esac

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.publish == 'true'
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 --max-time 120 \
            'https://github.com/modelcontextprotocol/registry/releases/download/v1.8.9/mcp-publisher_linux_amd64.tar.gz' \
            --output mcp-publisher.tar.gz
          echo '4d527ca8f1ced0394c962dc925c2a4a4addef441cbefd62501c875e9481823a8  mcp-publisher.tar.gz' | sha256sum --check
          tar xzf mcp-publisher.tar.gz mcp-publisher
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          for attempt in $(seq 1 6); do
            if "$RUNNER_TEMP/mcp-publisher" publish cli/server.json; then exit 0; fi
            sleep 10
          done
          exit 1

      # The Release asset is downloaded from npm, so it is byte-for-byte what users install.
      # --latest=false keeps "Latest" (and electron-updater's /releases/latest) on desktop releases.
      - name: GitHub Release with the npm tarball
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          npm pack "weft-canvas@${{ steps.meta.outputs.version }}" --pack-destination "$RUNNER_TEMP/release"
          awk -v h="## [$TAG]" 'index($0, h) == 1 { on = 1; next } on && /^## / { exit } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/release/*.tgz --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/release/*.tgz --title "weft-canvas ${{ steps.meta.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --latest=false
          fi
